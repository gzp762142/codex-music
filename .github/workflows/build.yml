name: Build tipa

on:
  push:
    branches: [main, master]
    # 只在会真正影响产物的文件变动时触发。
    # 这是省钱手段：macOS runner 按 10 倍计费（私有库 2000 分钟/月 ≈ 200 分钟
    # macOS 时间 ≈ 40 次编译），改文档/分析记录不该吃掉额度。
    paths:
      - 'Aether/**'
      - 'AppIcons/**'
      - 'Assets.xcassets/**'
      - 'project.yml'
      - 'Info.plist'
      - 'Music.entitlements'
      - 'MusicIdentity.xcconfig'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# 连续 push 时取消上一个还没跑完的流程 —— 避免为同一份代码排队烧两次额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    # 卡死的流程会一直占额度，给个上限。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          set -euo pipefail
          ls /Applications | grep -i xcode || true
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d /Applications/Xcode_15.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          elif [ -d /Applications/Xcode_15.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcode-select -p

      - name: Install tools
        run: |
          set -euo pipefail
          brew install xcodegen ldid

      - name: Generate and downgrade pbxproj format
        run: |
          set -euo pipefail
          rm -rf Music.xcodeproj
          xcodegen generate
          PBX=Music.xcodeproj/project.pbxproj
          sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 60;/' "$PBX"
          sed -i '' -E 's/compatibilityVersion = \"Xcode [0-9.]+\";/compatibilityVersion = "Xcode 14.0";/' "$PBX"
          sed -i '' -E 's/LastUpgradeCheck = [0-9]+;/LastUpgradeCheck = 1540;/' "$PBX"
          OBJ=$(grep -m1 'objectVersion' "$PBX" | tr -dc '0-9')
          echo "objectVersion=$OBJ"
          test "$OBJ" = "60"

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          rm -rf build Payload
          xcodebuild \
            -project Music.xcodeproj \
            -scheme Music \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package tipa with Music.entitlements
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -name 'Music.app' -type d | head -n1)
          echo "APP_PATH=$APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # Use a clean temp plist path (no spaces / odd chars).
          cp Music.entitlements /tmp/Music.entitlements
          ENT=/tmp/Music.entitlements
          BIN="Payload/Music.app/Music"
          test -f "$BIN"

          echo "Signing Mach-O with $ENT"
          # -S<path> embeds the plist into the code signature.
          # Bare `ldid -S` → empty entitlements → sandboxed App under TrollStore.
          ldid -S"$ENT" "$BIN"
          echo "ldid sign exit=$?"

          # codesign often "succeeds" with 0-byte dump on ldid adhoc binaries.
          # ldid -e on the Mach-O is the reliable dump; some brew builds assert
          # on the .app bundle, so always point at the binary.
          DUMP=/tmp/embedded.plist
          : >"$DUMP"
          set +e
          ldid -e "$BIN" >"$DUMP" 2>/tmp/ldid_e.err
          LEC=$?
          set -e
          echo "ldid -e exit=$LEC bytes=$(wc -c <"$DUMP")"
          cat /tmp/ldid_e.err || true

          if [ ! -s "$DUMP" ]; then
            echo "ldid -e empty, trying codesign"
            set +e
            codesign -d --entitlements :- "$BIN" >"$DUMP" 2>/tmp/cs.err
            set -e
            cat /tmp/cs.err || true
            echo "codesign dump bytes=$(wc -c <"$DUMP")"
          fi

          if [ ! -s "$DUMP" ]; then
            echo "Could not dump entitlements via ldid/codesign" >&2
            # Last resort: strings on the binary must still contain keys we signed.
            strings "$BIN" | tee /tmp/bin.strings | grep -q 'com.apple.Music'
            grep -q 'platform-application' /tmp/bin.strings
            grep -q 'no-sandbox' /tmp/bin.strings
            echo "entitlements OK (verified via strings)"
          else
            echo "---- embedded entitlements ----"
            cat "$DUMP"
            grep -q 'com.apple.Music' "$DUMP"
            grep -q 'platform-application' "$DUMP"
            grep -q 'no-sandbox' "$DUMP"
            echo "entitlements OK"
          fi

          echo "Copying loose AppIcon*.png into app bundle root"
          cp -f Assets.xcassets/AppIcon.appiconset/AppIcon*.png Payload/Music.app/
          ls Payload/Music.app/AppIcon*.png | head

          zip -qry Music.tipa Payload
          ls -la Music.tipa

      - name: Upload tipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music-tipa
          path: Music.tipa
          if-no-files-found: error

      - name: Attach to release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Music.tipa
          generate_release_notes: true
